<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Midas · Flow review prototype</title>
  <style>
    :root{--ink:#17201d;--muted:#65706b;--paper:#f4f1e9;--panel:#fffdf8;--line:#d9d5ca;--gold:#b88432;--green:#225b49;--red:#9a493f;--shadow:0 20px 55px rgba(35,43,39,.12)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif} button,input{font:inherit} button{cursor:pointer}
    .shell{min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 34px;border-bottom:1px solid var(--line);background:rgba(244,241,233,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}
    .brand{font:700 20px/1.1 Georgia,serif;letter-spacing:.02em}.brand span{color:var(--gold)}.meta{display:flex;gap:24px;color:var(--muted);font-size:13px}.meta b{display:block;color:var(--ink);font-size:16px}
    .main{max-width:1280px;margin:auto;padding:34px 34px 110px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--green);font-weight:800}.title{font:600 clamp(30px,4vw,54px)/1.02 Georgia,serif;margin:8px 0 12px;max-width:820px}.lede{color:var(--muted);max-width:720px;margin:0 0 28px}
    .progress{height:7px;background:#e1ddd3;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);width:0;transition:width .25s}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#eee8db;font-size:11px;font-weight:800;letter-spacing:.06em}.pill.warn{background:#f3dfbf;color:#76531e}.pill.bad{background:#f1d8d2;color:#7f3b34}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.btn{border:1px solid var(--line);background:white;border-radius:11px;padding:11px 15px;color:var(--ink)}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.danger{color:var(--red)}button:focus-visible,input:focus-visible{outline:3px solid #e3b566;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}
    .legs{display:grid;grid-template-columns:1fr 64px 1fr;align-items:stretch;gap:12px}.leg{padding:24px}.leg small{color:var(--muted)}.amount{font:600 30px/1 Georgia,serif;margin:12px 0}.desc{font-weight:650;margin-top:16px}.arrow{display:grid;place-items:center;color:var(--gold);font-size:28px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.empty{padding:60px;text-align:center}
    .shared-leg{padding:20px;margin-bottom:16px;background:#f4efe4;border:1px solid var(--line);border-radius:14px}.shared-leg .amount{font-size:24px}.match-options{display:grid;gap:10px;margin:14px 0}.match-option{width:100%;display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;text-align:left;padding:15px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}.match-option.selected{border-color:var(--green);box-shadow:0 0 0 2px rgba(34,91,73,.16)}.radio-dot{width:18px;height:18px;border:2px solid #89918d;border-radius:50%;display:grid;place-items:center}.selected .radio-dot:after{content:'';width:8px;height:8px;border-radius:50%;background:var(--green)}.option-copy small{display:block;color:var(--muted);margin-top:3px}.group-question{font:600 27px/1.15 Georgia,serif;margin:8px 0}.decision-note{color:var(--muted);font-size:13px;margin:0 0 14px}
    /* A: focused decision inbox */
    .variant-a .workspace{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px}.variant-a .queue{padding:18px}.queue-stat{padding:13px 0;border-bottom:1px solid var(--line)}.queue-stat:last-child{border:0}.variant-a .review{padding:30px}.variant-a .context{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
    /* B: dense evidence table */
    .toolbar{display:flex;gap:10px;justify-content:space-between;margin:18px 0}.toolbar input{min-width:320px;border:1px solid var(--line);border-radius:10px;padding:11px;background:white}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:var(--panel)}.table th,.table td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:sticky;top:81px;background:var(--panel)}.table .mini{max-width:290px;color:var(--muted);font-size:12px}.choice{display:flex;gap:5px}.choice button{border:1px solid var(--line);background:white;border-radius:7px;padding:6px 8px}.choice button.on{background:var(--green);color:white}
    /* C: relationship map */
    .variant-c .map{display:grid;grid-template-columns:220px minmax(420px,1fr) 320px;gap:18px}.accounts,.evidence{padding:20px}.account{padding:11px;border:1px solid var(--line);border-radius:10px;margin-top:9px;background:white}.flows{padding:20px;min-height:550px}.flow-row{width:100%;display:grid;grid-template-columns:120px 1fr 120px;gap:10px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;text-align:left}.flow-line{height:2px;background:var(--gold);position:relative}.flow-line:after{content:'›';position:absolute;right:-2px;top:-15px;font-size:24px;color:var(--gold)}.flow-row.selected{background:#f7efdf}.evidence{position:sticky;top:105px;height:max-content}.evidence h3{font:600 24px Georgia,serif}.evidence .desc{padding:12px;background:white;border:1px solid var(--line);border-radius:10px}
    .switcher{position:fixed;z-index:20;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px;background:#17201d;color:white;border-radius:999px;box-shadow:0 12px 40px rgba(0,0,0,.28)}.switcher button{width:36px;height:36px;border-radius:50%;border:0;background:#303a36;color:white}.switcher strong{min-width:190px;text-align:center;font-size:12px;letter-spacing:.04em}
    .privacy{font-size:12px;color:var(--muted);margin-top:14px}.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(prefers-reduced-motion:reduce){.progress i{transition:none}}
    @media(max-width:850px){.top{padding:18px}.meta{display:none}.main{padding:24px 16px 100px}.variant-a .workspace,.variant-c .map{grid-template-columns:1fr}.variant-a .queue{display:none}.legs{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.table th{top:73px}.variant-c .evidence{position:static}.toolbar{display:block}.toolbar input{width:100%;min-width:0}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top"><div class="brand">MIDAS <span>·</span> REVIEW LAB</div><div class="meta"><div><b id="remainingTop">0</b>remaining</div><div><b id="resolvedTop">0</b>resolved now</div><div><b id="accountsTop">0</b>accounts</div></div></header>
    <main class="main" id="app"></main>
  </div>
  <nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><strong id="variantLabel"></strong><button id="next" aria-label="Next variant">→</button></nav>
  <script id="reviewData" type="application/json">__REVIEW_DATA__</script>
  <script>
    const data=JSON.parse(document.getElementById('reviewData').textContent);const decisions=new Map();let selectedGroupId=data.groups[0]?.id||null,selectedOptionId=data.groups[0]?.options[0]?.id||null,searchQuery='',focusAfterRender=null;
    const variants={A:'Decision inbox',B:'Evidence table',C:'Cash-flow map'};const keys=Object.keys(variants);
    const money=(n,c)=>new Intl.NumberFormat('en-IN',{style:'currency',currency:c,maximumFractionDigits:0}).format(n/100);
    const reason=c=>c.reason==='AMBIGUOUS_MULTIPLE_CANDIDATES'?'Multiple equally supported counterparts':c.reason==='REFERENCE_CORRELATED_CANDIDATE'?'Matching amount, date, and shared reference':'Amount/date match; evidence incomplete';
    const type=c=>c.type==='CARD_PAYMENT'?'Card payment':'Internal transfer';
    function currentVariant(){const v=new URLSearchParams(location.search).get('variant')||'A';return variants[v]?v:'A'}
    function setVariant(v){const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState({},'',u);render()}
    function group(id){return data.groups.find(g=>g.id===id)}
    function decisionResolved(value){return value==='none'||String(value||'').startsWith('confirm:')}
    function decide(groupId,value,action=value){decisions.set(groupId,value);if(currentVariant()==='A'&&decisionResolved(value))selectedGroupId=null;focusAfterRender={id:groupId,action};render()}
    function openGroup(groupId,optionId){selectedGroupId=groupId;selectedOptionId=optionId||group(groupId)?.options[0]?.id||null;setVariant('A')}
    function selectOption(groupId,optionId){selectedGroupId=groupId;selectedOptionId=optionId;focusAfterRender={id:optionId,action:'row'};render()}
    function stats(){const values=[...decisions.values()];const resolved=values.filter(decisionResolved).length;const deferred=values.filter(v=>v==='later').length;return {resolved,deferred,remaining:data.groups.length-resolved}}
    function chrome(){const s=stats();document.getElementById('remainingTop').textContent=s.remaining;document.getElementById('resolvedTop').textContent=s.resolved;document.getElementById('accountsTop').textContent=data.accounts;document.getElementById('variantLabel').textContent=`${currentVariant()} — ${variants[currentVariant()]}`}
    function intro(){const s=stats(),pct=data.groups.length?s.resolved/data.groups.length*100:0;return `<div class="eyebrow">Prototype · decisions stay in memory</div><h1 class="title">Teach Midas which money movements are really yours.</h1><p class="lede">Each question represents one possible movement. When several matches compete, choose at most one. Nothing here changes the parsed corpus or ledger; reload to reset every prototype decision.</p><div class="progress" role="progressbar" aria-label="Review progress" aria-valuemin="0" aria-valuemax="${data.groups.length}" aria-valuenow="${s.resolved}"><i style="width:${pct}%"></i></div>`}
    function legs(c){return `<div class="legs"><section class="leg card"><small>${escapeHtml(c.debit.account)} · ${c.debit.date}</small><div class="amount">−${money(c.amountMinor,c.currency)}</div><div class="desc">${escapeHtml(c.debit.description)}</div></section><div class="arrow">→</div><section class="leg card"><small>${escapeHtml(c.credit.account)} · ${c.credit.date}</small><div class="amount">+${money(c.amountMinor,c.currency)}</div><div class="desc">${escapeHtml(c.credit.description)}</div></section></div>`}
    function simpleActions(g,c){const d=decisions.get(g.id),confirmed=d===`confirm:${c.id}`;return `<div class="actions"><button data-decision-id="${g.id}" data-action="confirm" class="btn primary" onclick="decide('${g.id}','confirm:${c.id}','confirm')" aria-pressed="${confirmed}">Confirm ${c.type==='CARD_PAYMENT'?'payment':'transfer'}</button><button data-decision-id="${g.id}" data-action="none" class="btn danger" onclick="decide('${g.id}','none')" aria-pressed="${d==='none'}">Not related</button><button data-decision-id="${g.id}" data-action="later" class="btn" onclick="decide('${g.id}','later')" aria-pressed="${d==='later'}">Review later</button></div>`}
    function ambiguityChoices(g){const d=decisions.get(g.id),sample=g.options[0],shared=g.sharedLeg,ranked=Boolean(g.recommendedOptionId),defaultValue=d||`confirm:${sample.id}`;const options=g.options.map((c,index)=>{const counterpart=shared?(c.debitId===shared.id?c.credit:c.debit):null;const label=counterpart?`${counterpart.account} · ${counterpart.date}`:`${c.debit.account} to ${c.credit.account}`;const detail=counterpart?counterpart.description:`${c.debit.description} → ${c.credit.description}`;const value=`confirm:${c.id}`,selected=d===value,recommended=c.id===g.recommendedOptionId;return `<button role="radio" tabindex="${defaultValue===value?'0':'-1'}" aria-checked="${selected}" class="match-option ${selected?'selected':''}" data-decision-id="${g.id}" data-action="option-${c.id}" onclick="decide('${g.id}','${value}','option-${c.id}')"><span class="radio-dot" aria-hidden="true"></span><span class="option-copy"><b>${recommended?'Recommended match':`Other possibility ${ranked?index:index+1}`}: ${escapeHtml(label)}</b><small>${recommended?'Amount, date, and a unique shared reference agree. ':''}${escapeHtml(detail)}</small></span><span>${c.dayGap}d</span></button>`}).join('');return `<h2 class="group-question">${ranked?'We found a likely match. Is it correct?':'Which transaction is the matching side?'}</h2><p class="decision-note">${ranked?'The recommended option has stronger evidence. Lower-confidence amount/date matches remain visible below.':'These choices have comparable evidence and compete for the same transaction.'} Selecting one automatically excludes the others.</p>${shared?`<div class="shared-leg"><small>Transaction being matched · ${escapeHtml(shared.account)} · ${shared.date}</small><div class="amount">${money(sample.amountMinor,sample.currency)}</div><div class="desc">${escapeHtml(shared.description)}</div></div>`:''}<div class="match-options" role="radiogroup" aria-label="Possible matching transactions" onkeydown="moveRadio(event)">${options}<button role="radio" tabindex="${defaultValue==='none'?'0':'-1'}" aria-checked="${d==='none'}" class="match-option ${d==='none'?'selected':''}" data-decision-id="${g.id}" data-action="none" onclick="decide('${g.id}','none')"><span class="radio-dot" aria-hidden="true"></span><span class="option-copy"><b>None of these are related</b><small>Keep every transaction separate.</small></span></button><button role="radio" tabindex="${defaultValue==='later'?'0':'-1'}" aria-checked="${d==='later'}" class="match-option ${d==='later'?'selected':''}" data-decision-id="${g.id}" data-action="later" onclick="decide('${g.id}','later')"><span class="radio-dot" aria-hidden="true"></span><span class="option-copy"><b>I’m not sure yet</b><small>Leave this question in the review queue.</small></span></button></div>`}
    function groupDecision(g){if(g.options.length>1)return ambiguityChoices(g);const c=g.options[0];return `<div class="context"><div><span class="pill warn">${reason(c)}</span><h2>${type(c)} · ${c.dayGap} day gap</h2></div><b>${money(c.amountMinor,c.currency)}</b></div>${legs(c)}${simpleActions(g,c)}`}
    function renderA(){const open=data.groups.filter(g=>!decisionResolved(decisions.get(g.id))).sort((a,b)=>(decisions.get(a.id)==='later')-(decisions.get(b.id)==='later'));let g=selectedGroupId&&group(selectedGroupId);if(!g)g=open[0];if(g){selectedGroupId=g.id;selectedOptionId=g.options[0]?.id||null}return `<div class="variant-a">${intro()}<div class="workspace" style="margin-top:24px"><aside class="queue card"><div class="eyebrow">Queue health</div><div class="queue-stat"><b>${stats().remaining}</b><br><small>questions remaining</small></div><div class="queue-stat"><b>${stats().deferred}</b><br><small>deferred, still remaining</small></div><div class="queue-stat"><b>${data.groups.filter(x=>x.options.some(c=>c.reason==='REFERENCE_CORRELATED_CANDIDATE')).length}</b><br><small>reference-supported</small></div><div class="queue-stat"><b>${data.groups.filter(x=>x.ambiguous).length}</b><br><small>equally supported choices</small></div><p class="privacy">Descriptions are shown only from your private local corpus.</p></aside><section class="review card">${g?groupDecision(g):'<div class="empty"><h2>Inbox cleared</h2><p>Reload to reset this prototype.</p></div>'}</section></div></div>`}
    function decisionStatus(g,d){if(!d)return 'Not reviewed';if(d==='none')return 'Current: none are related';if(d==='later')return 'Current: review later';const id=d.startsWith('confirm:')?d.slice(8):'',c=g.options.find(option=>option.id===id);if(!c)return 'Not reviewed';return c.id===g.recommendedOptionId?'Current: recommended match selected':`Current: ${escapeHtml(c.debit.account)} → ${escapeHtml(c.credit.account)}`}
    function renderB(){const rows=data.groups.map(g=>{const c=g.options[0],d=decisions.get(g.id),hasChoices=g.options.length>1,searchText=g.options.flatMap(x=>[x.debit.description,x.credit.description,x.debit.account,x.credit.account]).join(' ').toLowerCase(),hidden=searchQuery&&!searchText.includes(searchQuery.toLowerCase());const decision=hasChoices?`<button class="btn" data-decision-id="${g.id}" data-action="review" onclick="openGroup('${g.id}','${c.id}')">Review ${g.options.length} choices</button>`:`<div class="choice"><button data-decision-id="${g.id}" data-action="confirm" aria-label="Confirm pair" aria-pressed="${d===`confirm:${c.id}`}" class="${d===`confirm:${c.id}`?'on':''}" onclick="decide('${g.id}','confirm:${c.id}','confirm')">✓</button><button data-decision-id="${g.id}" data-action="none" aria-label="Mark not related" aria-pressed="${d==='none'}" class="${d==='none'?'on':''}" onclick="decide('${g.id}','none')">×</button><button data-decision-id="${g.id}" data-action="later" aria-label="Review later" aria-pressed="${d==='later'}" class="${d==='later'?'on':''}" onclick="decide('${g.id}','later')">…</button></div>`;const evidence=g.ambiguous?`${g.options.length} equally supported`:g.recommendedOptionId?`Recommended + ${g.options.length-1} alternative${g.options.length===2?'':'s'}`:c.reason==='REFERENCE_CORRELATED_CANDIDATE'?'Shared reference':'Needs evidence';return `<tr class="${hidden?'hidden':''}" data-search="${escapeAttr(searchText)}"><td><span class="pill ${g.ambiguous?'bad':'warn'}">${evidence}</span></td><td><b>${money(c.amountMinor,c.currency)}</b><br><small>${hasChoices?'Review choices':`${c.dayGap}d gap`}</small></td><td><b>${escapeHtml(c.debit.account)} → ${escapeHtml(c.credit.account)}</b><div class="mini">${hasChoices?(g.recommendedOptionId?'One recommended match; weaker alternatives retained.':'One transaction appears in several possible pairs.'):`${escapeHtml(c.debit.description)}<br>↳ ${escapeHtml(c.credit.description)}`}</div></td><td>${hasChoices?'Multiple possibilities':type(c)}</td><td>${decision}<div class="mini" role="status">${decisionStatus(g,d)}</div></td></tr>`}).join('');return `<div class="variant-b">${intro()}<div class="toolbar"><label class="sr-only" for="search">Filter review questions by description or account</label><input id="search" name="candidate-search" value="${escapeAttr(searchQuery)}" autocomplete="off" aria-label="Filter review questions by description or account" placeholder="Filter descriptions or accounts…" oninput="filterRows(this.value)"><span class="pill">Batch triage</span></div><div class="table-wrap card"><table class="table"><thead><tr><th>Evidence</th><th>Amount</th><th>Movement</th><th>Guess</th><th>Decision</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
    function renderC(){const entries=data.groups.flatMap(g=>g.options.map(c=>({g,c}))),selected=entries.find(x=>x.c.id===selectedOptionId)||entries[0],accounts=[...new Set(data.candidates.flatMap(x=>[x.debit.account,x.credit.account]))];if(selected){selectedGroupId=selected.g.id;selectedOptionId=selected.c.id}const rows=entries.map(({g,c})=>`<button type="button" data-row-id="${c.id}" class="flow-row ${c.id===selectedOptionId?'selected':''}" aria-pressed="${c.id===selectedOptionId}" onclick="selectOption('${g.id}','${c.id}')"><b>${escapeHtml(c.debit.account)}</b><span><span class="flow-line" style="display:block"></span><small>${money(c.amountMinor,c.currency)} · ${c.dayGap}d</small></span><b>${escapeHtml(c.credit.account)}</b></button>`).join('');return `<div class="variant-c">${intro()}<div class="map" style="margin-top:24px"><aside class="accounts card"><div class="eyebrow">Owned accounts</div>${accounts.map(a=>`<div class="account">${escapeHtml(a)}</div>`).join('')}</aside><section class="flows card"><div class="eyebrow">Candidate flow map · all candidates</div>${rows}</section><aside class="evidence card">${selected?groupDecision(selected.g):''}</aside></div></div>`}
    function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escapeAttr(v){return escapeHtml(v)}
    function filterRows(v){searchQuery=v;document.querySelectorAll('tbody tr').forEach(r=>r.classList.toggle('hidden',!r.dataset.search.includes(v.toLowerCase())))}
    function moveRadio(event){if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;event.preventDefault();event.stopPropagation();const radios=[...event.currentTarget.querySelectorAll('[role="radio"]')],current=radios.indexOf(document.activeElement),delta=['ArrowRight','ArrowDown'].includes(event.key)?1:-1;radios[(current+delta+radios.length)%radios.length].click()}
    function render(){chrome();document.getElementById('app').innerHTML=({A:renderA,B:renderB,C:renderC})[currentVariant()]();if(focusAfterRender){const f=focusAfterRender;const selector=f.action==='row'?`[data-row-id="${f.id}"]`:`[data-decision-id="${f.id}"][data-action="${f.action}"]`;const target=document.querySelector(selector)||document.querySelector('[data-decision-id]');target?.focus();focusAfterRender=null}}
    function cycle(delta){const i=keys.indexOf(currentVariant());setVariant(keys[(i+delta+keys.length)%keys.length])}
    document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable||document.activeElement.closest('[role="radiogroup"]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
  </script>
</body>
</html>

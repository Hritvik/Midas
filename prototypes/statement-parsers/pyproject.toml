[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-statement-parsers"
version = "0.1.0"
description = "Prototype parsers for supported Indian bank and credit-card statements"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11,<1", "pypdf>=5,<7"]

[project.scripts]
midas-parse-statement = "statement_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
